name: Daily Hindi Story

on:
  schedule:
    # The main start comes from cron-job.org at 7:55 AM, 12:55 PM and 6:55 PM India time (on time).
    # These GitHub times are only a backup - they post nothing if the video is already out.
    - cron: "10 3 * * *"    # backup ~8:40 AM India time
    - cron: "10 8 * * *"    # backup ~1:40 PM India time
    - cron: "10 14 * * *"   # backup ~7:40 PM India time
  workflow_dispatch:        # lets you press "Run workflow" to test any time
    inputs:
      language:
        description: "Force language (hi or bn). Leave empty to alternate."
        required: false
        default: ""
      mode:
        description: "Leave empty for a test. (cron-job.org sends 'auto'.)"
        required: false
        default: ""

permissions:
  contents: write           # needed to save history.json (stops repeat stories)

concurrency:
  group: hindi-story
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # newest history.json

      - name: Install video tools and Hindi + Bengali fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core libraqm0 libfribidi0 > /dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -q requests pillow edge-tts gTTS numpy scipy opencv-python-headless "rembg[cpu]"

      - name: Make the video and post it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PAGE_NAME: ${{ secrets.PAGE_NAME }}
          PAGE_NAME_HI: ${{ secrets.PAGE_NAME_HI }}
          PAGE_NAME_BN: ${{ secrets.PAGE_NAME_BN }}
          LANGUAGE: ${{ github.event.inputs.language }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ github.event.inputs.mode }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          VOICE: ${{ secrets.VOICE }}
        run: python main.py

      - name: Remember this story
        if: success()
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add history.json
          git commit -m "story posted $(date -u +%F_%H%M)" || exit 0
          git pull --rebase -q || true
          git push -q

      - name: Keep a copy of the video (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-video
          path: |
            work/final.mp4
            work/thumbnail.jpg
            work/story.json
          retention-days: 3
          if-no-files-found: ignore
