name: Daily Hindi Story

on:
  schedule:
    # The main start comes from cron-job.org at 6:55 AM, 11:55 AM and 5:55 PM India time (videos out ~8, ~1, ~7).
    # These GitHub times are only a backup - they post nothing if the video is already out.
    - cron: "10 2 * * *"    # backup ~7:40 AM India time
    - cron: "10 7 * * *"    # backup ~12:40 PM India time
    - cron: "10 13 * * *"   # backup ~6:40 PM India time
    - cron: "30 4 * * 0"    # Sunday 10:00 AM India time: weekly long compilation video
  workflow_dispatch:        # lets you press "Run workflow" to test any time
    inputs:
      language:
        description: "Force language (hi or bn). Leave empty to alternate."
        required: false
        default: ""
      mode:
        description: "Leave empty for a test. compilation = weekly long video. (cron-job.org sends 'auto'.)"
        required: false
        default: ""

permissions:
  contents: write           # needed to save history.json (stops repeat stories)

concurrency:
  group: hindi-story
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # newest history.json

      - name: Install video tools and Hindi + Bengali fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core libraqm0 libfribidi0 > /dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -q requests pillow edge-tts gTTS numpy scipy opencv-python-headless "rembg[cpu]" "mediapipe==0.10.14"

      - name: Keep the free voice model saved between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: indic-parler-tts-v1

      - name: Install the free voice model (only when HF_TOKEN is set)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            # torch + torchaudio must be the SAME matching CPU versions, installed together first
            pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
            pip install -q git+https://github.com/huggingface/parler-tts.git soundfile
            python -c "import torch, torchaudio; from parler_tts import ParlerTTSForConditionalGeneration; print('free voice model ready', torch.__version__)"
          else
            echo "HF_TOKEN not set - free voice model skipped"
          fi

      - name: Make the video and post it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_KEY: ${{ secrets.GEMINI_TTS_KEY }}
          GEMINI_TTS_KEY_2: ${{ secrets.GEMINI_TTS_KEY_2 }}
          GEMINI_TTS_KEY_3: ${{ secrets.GEMINI_TTS_KEY_3 }}
          GEMINI_TTS_KEY_4: ${{ secrets.GEMINI_TTS_KEY_4 }}
          GEMINI_TTS_KEY_5: ${{ secrets.GEMINI_TTS_KEY_5 }}
          TTS_PAID: ${{ secrets.TTS_PAID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_EXTRA: ${{ secrets.YT_EXTRA }}
          PAGE_NAME: ${{ secrets.PAGE_NAME }}
          PAGE_NAME_HI: ${{ secrets.PAGE_NAME_HI }}
          PAGE_NAME_BN: ${{ secrets.PAGE_NAME_BN }}
          LANGUAGE: ${{ github.event.inputs.language }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 4 * * 0' && 'compilation') || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          VOICE: ${{ secrets.VOICE }}
        run: python main.py

      - name: Remember this story
        if: success()
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add history.json
          git add assets 2>/dev/null || true
          git commit -m "story posted $(date -u +%F_%H%M)" || exit 0
          git pull --rebase -q || true
          git push -q

      - name: Tell me on Telegram if the run failed
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          if [ -z "$TG_CHAT" ]; then
            TG_CHAT=$(curl -s "https://api.telegram.org/bot$TG_TOKEN/getUpdates" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[-1]['message']['chat']['id'] if r and 'message' in r[-1] else '')")
          fi
          [ -n "$TG_CHAT" ] && curl -s "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" --data-urlencode text="❌ Cartoon bot run failed. Open: $RUN_URL" > /dev/null || true

      - name: Keep a copy of the video (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-video
          path: |
            work/final.mp4
            work/thumbnail.jpg
            work/story.json
          retention-days: 3
          if-no-files-found: ignore
